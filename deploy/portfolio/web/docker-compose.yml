services:
  web:
    image: ${PORTFOLIO_WEB_IMAGE:-lyo-portfolio-web:latest}
    build:
      context: ../../..
      dockerfile: deploy/portfolio/web/Dockerfile
    restart: unless-stopped
    environment:
      LYO_API_BASE_URL: ${LYO_API_BASE_URL:?set LYO_API_BASE_URL to internal TestApi URL}
      LYO_API_TOKEN: ${LYO_API_TOKEN:-}
      PORT: "3100"
      HOSTNAME: "0.0.0.0"
    ports:
      - "${WEB_HOST_PORT:-3100}:3100"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3100/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    profiles:
      - tls

volumes:
  caddy_data:
  caddy_config:
