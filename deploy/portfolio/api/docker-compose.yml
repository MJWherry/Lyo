services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lyo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-lyo}
    volumes:
      - lyo_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - api_net

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-lyo}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-lyo}
    networks:
      - api_net

  api:
    image: ${PORTFOLIO_API_IMAGE:-lyo-portfolio-api:latest}
    build:
      context: ../../..
      dockerfile: deploy/portfolio/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:5251
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB:-lyo};Username=${POSTGRES_USER:-lyo};Password=${POSTGRES_PASSWORD}
      PostgresConfig__ConnectionString: Host=postgres;Port=5432;Database=${POSTGRES_DB:-lyo};Username=${POSTGRES_USER:-lyo};Password=${POSTGRES_PASSWORD}
      PostgresUser__ConnectionString: Host=postgres;Port=5432;Database=${POSTGRES_DB:-lyo};Username=${POSTGRES_USER:-lyo};Password=${POSTGRES_PASSWORD}
      PostgresFileMetadataStore__ConnectionString: Host=postgres;Port=5432;Database=${POSTGRES_DB:-lyo};Username=${POSTGRES_USER:-lyo};Password=${POSTGRES_PASSWORD}
      RabbitMqOptions__Host: rabbitmq
      RabbitMqOptions__Port: "5672"
      RabbitMqOptions__Username: ${RABBITMQ_USER:-lyo}
      RabbitMqOptions__Password: ${RABBITMQ_PASSWORD:-lyo}
      RabbitMqOptions__VirtualHost: /
      RabbitMqOptions__AdminUrl: http://rabbitmq:15672
      LocalFileStorage__RootDirectoryPath: /var/lyo/portfolio-files
      GoogleAuth__ClientId: ${GoogleAuth__ClientId:-}
      GoogleAuth__ClientSecret: ${GoogleAuth__ClientSecret:-}
      GoogleAuth__RedirectUri: ${GoogleAuth__RedirectUri:-}
    ports:
      - "${PORTFOLIO_API_HOST_PORT:-5251}:5251"
    volumes:
      - portfolio_files:/var/lyo/portfolio-files
    networks:
      - api_net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5251/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

networks:
  api_net:
    driver: bridge

volumes:
  lyo_pg_data:
  portfolio_files:
