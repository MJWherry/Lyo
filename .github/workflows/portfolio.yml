# Lyo portfolio — build TS clients + Next.js + TestApi images, Terraform, deploy via SSM.
# Required repository secrets:
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
#   TF_VAR_postgres_password, TF_VAR_rabbitmq_password

name: Portfolio

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      apply_terraform:
        description: Apply Terraform plan
        type: boolean
        default: false
      deploy_api:
        description: Deploy API stack via SSM
        type: boolean
        default: false
      deploy_web:
        description: Deploy web stack via SSM
        type: boolean
        default: false

env:
  AWS_DEFAULT_REGION: us-east-2
  NODE_VERSION: "22"
  PORTFOLIO_TF_DIR: infra/aws/portfolio/environments/prod
  NAME_PREFIX: lyo-portfolio

jobs:
  build-ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Build TypeScript packages
        run: |
          set -euo pipefail
          for pkg in lyo-api-client lyo-query lyo-query-react lyo-person-api-client; do
            cd "$GITHUB_WORKSPACE/packages/typescript/$pkg"
            npm ci --ignore-scripts || npm install
            npm run build
          done
      - uses: actions/upload-artifact@v4
        with:
          name: ts-dist
          path: |
            packages/typescript/lyo-api-client/dist/
            packages/typescript/lyo-query/dist/
            packages/typescript/lyo-query-react/dist/
            packages/typescript/lyo-person-api-client/dist/
          retention-days: 1

  build-web:
    runs-on: ubuntu-latest
    needs: [build-ts]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: ts-dist
      - name: Build portfolio
        working-directory: apps/portfolio
        env:
          LYO_API_BASE_URL: http://127.0.0.1:5251
        run: |
          npm ci || npm install
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: portfolio-web
          path: |
            apps/portfolio/.next/
            apps/portfolio/public/
            apps/portfolio/package.json
            apps/portfolio/next.config.ts
          retention-days: 1

  image-api:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      - name: Build and push TestApi image
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail
          REPO="${ECR_REGISTRY}/${NAME_PREFIX}-testapi"
          TAG="${GITHUB_SHA:0:7}"
          docker build -f deploy/portfolio/api/Dockerfile -t "${REPO}:${TAG}" -t "${REPO}:latest" .
          docker push "${REPO}:${TAG}"
          docker push "${REPO}:latest"

  image-web:
    runs-on: ubuntu-latest
    needs: [build-ts]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ts-dist
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      - name: Build and push portfolio web image
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail
          REPO="${ECR_REGISTRY}/${NAME_PREFIX}-web"
          TAG="${GITHUB_SHA:0:7}"
          docker build -f deploy/portfolio/web/Dockerfile -t "${REPO}:${TAG}" -t "${REPO}:latest" .
          docker push "${REPO}:${TAG}"
          docker push "${REPO}:latest"

  terraform-plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.PORTFOLIO_TF_DIR }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}
      - name: Terraform init / plan
        env:
          TF_VAR_postgres_password: ${{ secrets.TF_VAR_postgres_password }}
          TF_VAR_rabbitmq_password: ${{ secrets.TF_VAR_rabbitmq_password }}
        run: |
          terraform init -input=false
          terraform plan -input=false -out=tfplan
      - uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: ${{ env.PORTFOLIO_TF_DIR }}/tfplan
          retention-days: 7

  terraform-apply:
    runs-on: ubuntu-latest
    needs: [terraform-plan]
    if: github.event_name == 'workflow_dispatch' && inputs.apply_terraform
    environment: portfolio-prod
    defaults:
      run:
        working-directory: ${{ env.PORTFOLIO_TF_DIR }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}
      - uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: ${{ env.PORTFOLIO_TF_DIR }}
      - name: Terraform apply
        env:
          TF_VAR_postgres_password: ${{ secrets.TF_VAR_postgres_password }}
          TF_VAR_rabbitmq_password: ${{ secrets.TF_VAR_rabbitmq_password }}
        run: |
          terraform init -input=false
          terraform apply -input=false -auto-approve tfplan

  deploy-api:
    runs-on: ubuntu-latest
    needs: [image-api, image-web]
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_api
    environment: portfolio-prod
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}
      - name: Deploy API via SSM
        run: |
          set -euo pipefail
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          API_INSTANCE=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=${NAME_PREFIX}-api" "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)
          IMAGE="${ACCOUNT}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/${NAME_PREFIX}-testapi:latest"
          PG_PARAM="/${NAME_PREFIX}/postgres/password"
          aws ssm send-command \
            --instance-ids "$API_INSTANCE" \
            --document-name AWS-RunShellScript \
            --parameters "commands=[\"set -euxo pipefail\",\"aws ecr get-login-password --region ${AWS_DEFAULT_REGION} | docker login --username AWS --password-stdin ${ACCOUNT}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com\",\"cd /opt/lyo/portfolio/api\",\"export TESTAPI_IMAGE=${IMAGE}\",\"export POSTGRES_PASSWORD=\$(aws ssm get-parameter --name ${PG_PARAM} --with-decryption --query Parameter.Value --output text)\",\"docker pull ${IMAGE}\",\"docker compose up -d\"]" \
            --output text

  deploy-web:
    runs-on: ubuntu-latest
    needs: [image-api, image-web]
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_web
    environment: portfolio-prod
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}
      - name: Deploy web via SSM
        run: |
          set -euo pipefail
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          WEB_INSTANCE=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=${NAME_PREFIX}-web" "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)
          API_IP=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=${NAME_PREFIX}-api" "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].PrivateIpAddress' --output text)
          IMAGE="${ACCOUNT}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/${NAME_PREFIX}-web:latest"
          aws ssm send-command \
            --instance-ids "$WEB_INSTANCE" \
            --document-name AWS-RunShellScript \
            --parameters "commands=[\"set -euxo pipefail\",\"aws ecr get-login-password --region ${AWS_DEFAULT_REGION} | docker login --username AWS --password-stdin ${ACCOUNT}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com\",\"cd /opt/lyo/portfolio/web\",\"export PORTFOLIO_WEB_IMAGE=${IMAGE}\",\"export LYO_API_BASE_URL=http://${API_IP}:5251\",\"docker pull ${IMAGE}\",\"docker compose up -d\"]" \
            --output text
