# Story suites: SQLite, Postgres (Testcontainers on the runner's Docker), and the Story client.
# Manual like the other test workflows: Actions → Run workflow.
name: Test - Story

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BUILD_CONFIG: Release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Lyo
        uses: ./.github/actions/setup-lyo

      - name: Restore
        run: dotnet restore Lyo.Net/Lyo.slnx

      - name: Test Story projects
        run: python3 scripts/nuget/ci_test.py --scope named --packages "Lyo.Story.*"
