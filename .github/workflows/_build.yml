# Reusable: compile Lyo.Net/Lyo.slnx (no tests).
name: Build

on:
  workflow_call:
    inputs:
      version:
        description: Version stamped on assemblies
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build CI - ${{ github.ref_name }} - v${{ inputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Lyo
        uses: ./.github/actions/setup-lyo

      - name: Restore
        run: dotnet restore Lyo.Net/Lyo.slnx

      - name: Build
        run: |
          set -euo pipefail
          file_ver="${VERSION%%-*}"
          dotnet build Lyo.Net/Lyo.slnx -c Release --no-restore \
            "/p:Version=${VERSION}" \
            "/p:InformationalVersion=${VERSION}" \
            "/p:FileVersion=${file_ver}"
        env:
          VERSION: ${{ inputs.version }}
