[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lyo-api-client"
version = "0.1.0"
description = "Python client for the Lyo API: transport-agnostic core plus a typed Person Query API client."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "The Lyo authors" }]
keywords = ["lyo", "api", "client"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["lyo_api_client", "lyo_person_api_client"]

[tool.setuptools.package-data]
lyo_api_client = ["py.typed"]
lyo_person_api_client = ["py.typed"]
